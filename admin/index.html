<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Yönetim Paneli | Mom's Hands</title>
<meta name="theme-color" content="#211D25">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<section class="login" id="login">
  <form class="login-card" id="loginForm">
    <svg class="lh" viewBox="0 0 24 24"><path d="M12 21C7 17 2 13.6 2 8.6 2 5.5 4.4 3.5 7 3.5c2.2 0 3.8 1.3 5 3 1.2-1.7 2.8-3 5-3 2.6 0 5 2 5 5.1 0 5-5 8.4-10 12.4z"/></svg>
    <h1>Mom's Hands</h1>
    <p class="script">Yönetim Paneli</p>
    <label class="fld"><span>Şifre</span><input type="password" id="pw" autocomplete="current-password" required placeholder="••••••••"></label>
    <button class="btn primary wide" type="submit">Giriş yap</button>
    <p class="err" id="loginErr" hidden></p>
    <a class="back" href="/">Menüye dön</a>
  </form>
</section>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24"><path d="M12 21C7 17 2 13.6 2 8.6 2 5.5 4.4 3.5 7 3.5c2.2 0 3.8 1.3 5 3 1.2-1.7 2.8-3 5-3 2.6 0 5 2 5 5.1 0 5-5 8.4-10 12.4z"/></svg><div><b>Mom's Hands</b><small>Yönetim Paneli</small></div></div>
    <div class="top-actions">
      <span class="dirty" id="dirty" hidden>Kaydedilmedi</span>
      <button class="btn ghost" id="previewBtn" title="Önizle">Önizle</button>
      <button class="btn primary" id="publishBtn">Yayınla</button>
      <button class="btn icon" id="logoutBtn" title="Çıkış"><svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg></button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="menu">Menü</button>
    <button class="tab" data-tab="settings">Ayarlar</button>
    <button class="tab" data-tab="images">Görseller</button>
  </nav>

  <main class="wrap">
    <section id="tab-menu" class="pane">
      <div class="pane-head">
        <div><h2>Menü Düzenleyici</h2><p class="muted" id="stats"></p></div>
        <button class="btn soft" id="addCat">+ Kategori ekle</button>
      </div>
      <div class="search"><input id="q" type="search" placeholder="Ürün ara..."></div>
      <div id="cats"></div>
    </section>

    <section id="tab-settings" class="pane" hidden>
      <div class="pane-head"><div><h2>İşletme Bilgileri</h2><p class="muted">Menünün üst ve alt kısmında görünen bilgiler.</p></div></div>
      <div class="card" id="settingsForm"></div>
    </section>

    <section id="tab-images" class="pane" hidden>
      <div class="pane-head">
        <div><h2>Görsel Kütüphanesi</h2><p class="muted">Logo, kapak ve ürün görsellerinizi buraya yükleyin.</p></div>
        <label class="btn soft">+ Görsel yükle<input type="file" id="libUpload" accept="image/*" multiple hidden></label>
      </div>
      <label class="drop" id="drop"><input type="file" accept="image/*" multiple hidden id="dropInput"><b>Görselleri buraya sürükleyin</b><span>ya da seçmek için dokunun. JPG, PNG, WEBP</span></label>
      <div class="lib" id="lib"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast" hidden></div>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
